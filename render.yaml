services:
  - type: web
    name: telegram-post-creator-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.main
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9